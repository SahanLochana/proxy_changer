name: 🚀 Build & Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    name: ⚡ Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 💾 Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: 🏷️ Extract version from Cargo.toml
        id: get_version
        shell: pwsh
        run: |
          $version = (Get-Content Cargo.toml | Select-String -Pattern '^version\s*=').ToString().Split('"')[1]
          Write-Host "Detected version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 🧪 Run tests
        run: cargo test --verbose

      - name: 🔨 Build release executable
        run: cargo build --release

      - name: 📦 Rename release binary
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          $dest = "Wi-Fi Proxy Switcher $ver.exe"
          Copy-Item "target/release/proxy_changer.exe" -Destination $dest
          Write-Host "Prepared release executable: $dest"

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Wi-Fi Proxy Switcher v${{ steps.get_version.outputs.version }} 🚀"
          body: |
            ### 📶 Wi-Fi Proxy Auto-Switcher v${{ steps.get_version.outputs.version }} 🚀

            - **Version:** `${{ steps.get_version.outputs.version }}`
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Platform:** Windows x64 (Native binary)

            #### 📥 Download
            Download **`Wi-Fi Proxy Switcher ${{ steps.get_version.outputs.version }}.exe`** below and run directly.
          files: |
            Wi-Fi Proxy Switcher ${{ steps.get_version.outputs.version }}.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
