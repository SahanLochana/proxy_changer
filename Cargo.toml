[package]
name = "proxy_changer"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinInet",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
native-windows-gui = { version = "1.0.13", features = [
    "tray-notification",
    "notice",
    "list-view",
    "combobox",
    "menu",
    "timer",
] }
native-windows-derive = "1.0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

